name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag, for example v1.1.0
        required: true
        type: string
      publish:
        description: Publish assets to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DROIDASSIST_KEYSTORE_PASSWORD: ${{ secrets.DROIDASSIST_KEYSTORE_PASSWORD }}
      DROIDASSIST_KEY_ALIAS: ${{ secrets.DROIDASSIST_KEY_ALIAS }}
      DROIDASSIST_KEY_PASSWORD: ${{ secrets.DROIDASSIST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DROIDASSIST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droidassist-release.jks"
          echo "DROIDASSIST_KEYSTORE_PATH=$RUNNER_TEMP/droidassist-release.jks" >> "$GITHUB_ENV"

      - name: Prepare scripts
        run: chmod +x gradlew deploy/package/*.sh deploy/portable/mac/*.command

      - name: Verify source
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :server:test

      - name: Build release assets
        run: |
          ./deploy/package/build-release-apk.sh
          ./deploy/package/build-portable.sh

      - uses: actions/upload-artifact@v4
        with:
          name: droidassist-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: DroidAssist ${{ inputs.tag }}
          body_path: docs/releases/v1.1.0.md
          files: dist/*
